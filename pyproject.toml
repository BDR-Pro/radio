[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-kid"
version = "0.1.0"
description = "A friendly Software Defined Radio playground for young engineers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bader" }]
dependencies = [
    "rich>=13.7.0",
    "textual>=0.60.0",
    "pyfiglet>=1.0.2",
    "questionary>=2.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.3",
    "folium>=0.15.1",
    "httpx>=0.27.0",
    "pyrtlsdr>=0.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "skyfield>=1.48",
    "python-dateutil>=2.9.0",
    "pyais>=3.2.0",
    "plyer>=2.1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sdr-kid = "sdr_kid.app:main"

[tool.setuptools.packages.find]
include = ["sdr_kid*"]
